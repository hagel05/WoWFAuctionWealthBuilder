[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wowflip"
version = "0.1.0"
description = "Hourly WoW Forever Auction House scanner that flags items to buy and resell for profit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wowflip = "wowflip.cli:main"

[tool.setuptools]
packages = ["wowflip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
