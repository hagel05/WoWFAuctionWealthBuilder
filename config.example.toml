# Copy this file to config.toml and edit. config.toml is not committed.
# Every setting is optional; anything left out uses the default shown.
# Environment variables (WOWFLIP_*) override this file; see README.

[account]
region = "us"            # us, eu, kr, tw
ruleset_id = 2           # 1 PvP, 2 Normal, 3 RP, 15 RP PvP
house_id = 111           # 111 = Alliance Normal (117 = Blackwater Normal)
include_commodities = true
bankroll_gold = 30       # starting gold; `wowflip bankroll 45` overrides it later

[schedule]
minute = 20              # minute past the hour for `wowflip scan --loop`

[storage]
data_dir = "data"        # SQLite history and logs
report_dir = "reports"   # latest.html, latest.csv, flag_log.csv

[items]
override_csv = "items_override.csv"
max_new_lookups_per_run = 1000

# In-game addon. On the PC where you play, point wow_dir at your WoW folder
# (the one that contains _forever_). Then every scan also updates the addon,
# and the gold the addon sees at the Auction House becomes your bankroll.
[addon]
# wow_dir = "C:/Program Files (x86)/World of Warcraft"
# game_folder = "_forever_"
# sync_url = ""                  # on PCs without the scanner: e.g. "http://truenas.local:8787"
# sync_minutes = 5               # how often the sync helper checks for a new scan
# bankroll_from_game = true
# bankroll_characters = []       # e.g. ["Matt - Dreamscythe"]; empty = last character at the AH

# API for sync helpers on other PCs (`wowflip serve`). Set WOWFLIP_API_TOKEN
# in the environment on the server and on each PC to require a shared secret.
[server]
# host = "0.0.0.0"
# port = 8787

# Market-wide rules. Values are first guesses from the scoring rules doc.
[market]
# history_days = 14
# recent_days = 3
# undercut = 0.03
# ah_cut = 0.05
# listing_hours = 24          # 2, 8 or 24
# deposit_rates = { "2" = 0.05, "8" = 0.20, "24" = 0.60 }
